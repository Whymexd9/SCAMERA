name: Check HP9 HexQuad boundaries
on:
  pull_request:
    paths:
      - 'app/src/main/cpp/scam-hexquad-*.h'
      - 'tools/*scam_hexquad*'
      - 'app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/HexQuadBurst.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/processing/render/Parameters.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/PostPipeline.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/processing/processor/HdrxProcessor.java'
      - 'app/src/main/res/xml/preferences.xml'
      - 'tools/java/HexQuad*Check.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/settings/HexQuadOptions.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/settings/PreferenceKeys.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/ui/settings/SettingsActivity.java'
      - 'app/src/main/res/values/strings.xml'
      - '.github/workflows/check-hexquad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check sparse RAW packing and inverse LUTs
        run: |
          g++ -pthread -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad.cpp -o /tmp/check-scam-hexquad
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-hexquad
      - name: Check malformed VDNN containers
        run: python tools/check_scam_hexquad_container.py
      - name: Check stock-reference normal VST and diagnostic charts
        run: |
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_vst.cpp -o /tmp/check-scam-hexquad-vst
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-hexquad-vst
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_charts.cpp -ldl -o /tmp/check-scam-hexquad-charts
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-hexquad-charts
      - name: Check six-frame capture transport, alignment and tile assembly
        run: |
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_capture.cpp -ldl -o /tmp/check-scam-hexquad-capture
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-hexquad-capture
      - name: Check ISO diagnostic fixtures and failed-gate preservation
        run: |
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_iso.cpp -ldl -o /tmp/check-scam-hexquad-iso
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-hexquad-iso
      - name: Check luma/chroma detail reconstruction and settings wiring
        run: |
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_detail.cpp -ldl -o /tmp/check-scam-hexquad-detail
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-hexquad-detail
          python tools/check_scam_hexquad_controls.py
      - name: Check profiled capture gate and sparse packing
        run: |
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_profile.cpp -ldl -o /tmp/check-scam-hexquad-profile
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-hexquad-profile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check model selection, noise controls, texture and native full output
        run: |
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_options.cpp -ldl -o /tmp/check-hex-options
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hex-options
          javac -d /tmp/hex-options-test app/src/main/java/com/particlesdevs/photoncamera/settings/HexQuadOptions.java tools/java/HexQuadOptionsCheck.java
          java -ea -cp /tmp/hex-options-test HexQuadOptionsCheck /tmp/hex-java-header.bin
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hex-options /tmp/hex-java-header.bin
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hex-options /tmp/hex-java-header.bin.gpu
      - name: Check deterministic CPU acceleration and thread synchronization
        run: |
          g++ -pthread -std=c++14 -O2 -Wall -Wextra -Werror tools/check_scam_hexquad_speed.cpp -ldl -o /tmp/check-hex-speed
          python tools/check_scam_hexquad_speed.py /tmp/check-hex-speed
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=thread tools/check_scam_hexquad_parallel.cpp -o /tmp/check-hex-threads
          /tmp/check-hex-threads
      - name: Check GLES compute against CPU and exercise fallback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev
          g++ -pthread -std=c++14 -O2 -Wall -Wextra -Werror tools/check_scam_hexquad_gpu.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hex-gpu
          python tools/check_scam_hexquad_gpu.py /tmp/check-hex-gpu
      - name: Check hybrid prefetch ownership and failure barriers
        run: |
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_scam_hexquad_hybrid.cpp -ldl -o /tmp/check-hex-hybrid
          ASAN_OPTIONS=detect_leaks=0 python tools/check_scam_hexquad_hybrid.py /tmp/check-hex-hybrid
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=thread tools/check_scam_hexquad_prefetch.cpp -o /tmp/check-hex-prefetch
          /tmp/check-hex-prefetch
          g++ -pthread -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=thread tools/check_scam_hexquad_hybrid.cpp -ldl -o /tmp/check-hex-hybrid-tsan
          python tools/check_scam_hexquad_hybrid.py /tmp/check-hex-hybrid-tsan --race
