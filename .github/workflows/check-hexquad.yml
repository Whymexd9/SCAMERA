name: Check HP9 HexQuad boundaries
on:
  pull_request:
    paths:
      - 'app/src/main/cpp/vivo-hexquad-*.h'
      - 'tools/*vivo_hexquad*'
      - 'app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/HexQuadBurst.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/PostPipeline.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/processing/processor/HdrxProcessor.java'
      - 'app/src/main/res/xml/preferences.xml'
      - 'tools/java/HexQuad*Check.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/settings/HexQuadOptions.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/settings/PreferenceKeys.java'
      - 'app/src/main/java/com/particlesdevs/photoncamera/ui/settings/SettingsActivity.java'
      - 'app/src/main/res/values/strings.xml'
      - 'app/src/main/java/com/particlesdevs/photoncamera/capture/HexQuadZslSelector.java'
      - '.github/workflows/check-hexquad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check sparse RAW packing and inverse LUTs
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad.cpp -o /tmp/check-vivo-hexquad
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-vivo-hexquad
      - name: Check malformed VDNN containers
        run: python tools/check_vivo_hexquad_container.py
      - name: Check stock-reference normal VST and diagnostic charts
        run: |
          g++ -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad_vst.cpp -o /tmp/check-vivo-hexquad-vst
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-vivo-hexquad-vst
          g++ -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad_charts.cpp -ldl -o /tmp/check-vivo-hexquad-charts
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-vivo-hexquad-charts
      - name: Check six-frame capture transport, alignment and tile assembly
        run: |
          g++ -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad_capture.cpp -ldl -o /tmp/check-vivo-hexquad-capture
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-vivo-hexquad-capture
      - name: Check ISO diagnostic fixtures and failed-gate preservation
        run: |
          g++ -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad_iso.cpp -ldl -o /tmp/check-vivo-hexquad-iso
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-vivo-hexquad-iso
      - name: Check luma/chroma detail reconstruction and settings wiring
        run: |
          g++ -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad_detail.cpp -ldl -o /tmp/check-vivo-hexquad-detail
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-vivo-hexquad-detail
          python tools/check_vivo_hexquad_controls.py
      - name: Check profiled capture gate and sparse packing
        run: |
          g++ -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad_profile.cpp -ldl -o /tmp/check-vivo-hexquad-profile
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-vivo-hexquad-profile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check HexQuad ZSL metadata selection
        run: |
          javac -d /tmp/hex-zsl-test app/src/main/java/com/particlesdevs/photoncamera/capture/HexQuadZslSelector.java tools/java/HexQuadZslSelectorCheck.java
          java -ea -cp /tmp/hex-zsl-test HexQuadZslSelectorCheck
      - name: Check model selection, noise controls, texture and native full output
        run: |
          g++ -std=c++14 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined tools/check_vivo_hexquad_options.cpp -ldl -o /tmp/check-hex-options
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hex-options
          javac -d /tmp/hex-options-test app/src/main/java/com/particlesdevs/photoncamera/settings/HexQuadOptions.java tools/java/HexQuadOptionsCheck.java
          java -ea -cp /tmp/hex-options-test HexQuadOptionsCheck /tmp/hex-java-header.bin
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hex-options /tmp/hex-java-header.bin
