name: Build SCAMERA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore source tree
        run: |
          mkdir source
          cat source-parts/SCAMERA-actions-source.tar.gz.part.* > SCAMERA-actions-source.tar.gz
          echo "851683a7f05156ae6e0f4c07b11c5873167829eb42106026d5a3a59040d2a76a  SCAMERA-actions-source.tar.gz" | sha256sum -c -
          tar -xzf SCAMERA-actions-source.tar.gz -C source
      - name: Upload source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Source
          path: SCAMERA-actions-source.tar.gz
          compression-level: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Build
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
