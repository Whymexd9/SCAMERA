name: Build SCAMERA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          mkdir source
          cat source-parts/SCAMERA-actions-source.tar.gz.part.* > SCAMERA-actions-source.tar.gz
          sha256sum -c SOURCE_SHA256
          tar -xzf SCAMERA-actions-source.tar.gz -C source
      - name: Restore tested APK
        run: |
          cat release-parts/SCAMERA-0.98-26729-FullMenus-Dynamic.apk.part.* > SCAMERA-0.98-26729-FullMenus-Dynamic.apk
          sha256sum -c APK_SHA256
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-26729-Tested-APK
          path: SCAMERA-0.98-26729-FullMenus-Dynamic.apk
          compression-level: 0
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Source
          path: source
          compression-level: 6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Build
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
