name: Build SCAMERA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          mkdir source
          cat source-parts/SCAMERA-actions-source.tar.gz.part.* > SCAMERA-actions-source.tar.gz
          echo "13890c59815b28a85c99f8a29db9d93cbd517a4dbf90ef762de15f0d776c04a6  SCAMERA-actions-source.tar.gz" | sha256sum -c -
          tar -xzf SCAMERA-actions-source.tar.gz -C source
      - name: Apply ACES navigation fix
        working-directory: source
        run: python3 ../patches/fix_aces_navigation.py
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Source
          path: source
          compression-level: 6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Build
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
