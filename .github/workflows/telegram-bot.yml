name: Telegram bot

# Answers the owner's private messages to the builds bot: settings, /here, /post (tools/telegram_bot.py,
# docs/telegram-channel.md). GitHub starts schedules every 5 minutes at best, often later.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # /post downloads the APK from a build artifact

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools

      - name: Answer the bot's messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_OWNER: ${{ secrets.TELEGRAM_OWNER }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_TOPIC: ${{ secrets.TELEGRAM_TOPIC }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/telegram_bot.py
