name: SHDR merge A/B replay

# Offline replay of the merge on small burst crops (tools/replay_hybrid_ab.py, host worker on Mesa) for tuning A/B without a
# phone. Runs only for replay/* branches, which carry the crops (research/replay-bursts/*.nch.xz) and the variants
# (research/replay-bursts/variants.txt); main never runs it. Results: the artifact replay-ab (npz + worker logs), kept 3 days.
on:
  push:
    branches: [ 'replay/**' ]

concurrency:
  group: replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the worker for the host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl-dev libgles-dev libegl1 libgl1-mesa-dri python3-numpy
          g++ -pthread -std=c++17 -O2 app/src/main/cpp/scam-neural-worker.cpp -ldl -lEGL -lGLESv2 -o /tmp/scam-neural-worker
          /tmp/scam-neural-worker --transport-check
      - name: Replay
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 python3 tools/replay_hybrid_ab.py /tmp/scam-neural-worker research/replay-bursts /tmp/replay-ab research/replay-bursts/variants.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-ab
          path: |
            /tmp/replay-ab/*.npz
            /tmp/replay-ab/*.log
            /tmp/replay-ab/summary.txt
          retention-days: 3
