name: Publish test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apk-parts/SCAMERA-26784.apk.part.*"
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble APK
        run: cat apk-parts/SCAMERA-26784.apk.part.* > SCAMERA-26784-debug.apk
      - name: Verify checksum
        run: echo "97bf6b87c476e34191e3cff9b1fe8c31d831e004d2cfba5e0fe5220f2d73f641  SCAMERA-26784-debug.apk" | sha256sum -c -
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-26784-debug
          path: SCAMERA-26784-debug.apk
          compression-level: 0
          retention-days: 90
