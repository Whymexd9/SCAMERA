name: Build SCAMERA test APK

on:
  push:
    branches: [ main, work ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so an upstream change cannot silently alter our native build.
  NCNN_UPSTREAM_SHA: 0a5ea3df054bb8933eeedd882236670247747afc

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Versioning uses the documented source baseline below.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action installs the obsolete "tools" package by default; it no
      # longer exists in current cmdline-tools and sdkmanager exits 1 on it,
      # which started failing every build. Everything needed is installed in
      # the step below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute versionCode
        id: ver
        # Reserve versions delivered locally; increment from the last published source baseline.
        run: echo "code=$((30196 + $(git rev-list --count c2d9e9bc4bf3d13467e48d86faad6a748e33ddcb..HEAD)))" >> "$GITHUB_OUTPUT"

      - name: Fetch vendored ncnn from upstream PhotonCamera
        run: |
          # CMakeLists falls back to a stub JNI library when
          # app/src/main/cpp/ncnn/<abi>/lib/libncnn.a is missing, which silently
          # disables FlowNet and KernelNet. The custom FlowNet layers need a
          # batch-capable ncnn (Mat::n / Mat::nstep / support_batch) that
          # upstream Tencent releases do not provide, so take the exact build
          # eszdman vendors. ~175 MB, sparse-checked-out instead of committed.
          git clone --depth 1 --branch dev --filter=blob:none --no-checkout \
            https://github.com/eszdman/PhotonCamera.git /tmp/upstream
          cd /tmp/upstream
          git fetch --depth 1 origin "$UPSTREAM_SHA"
          git sparse-checkout set --no-cone "app/src/main/cpp/ncnn"
          git checkout -q "$UPSTREAM_SHA"
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/cpp
          cp -r /tmp/upstream/app/src/main/cpp/ncnn app/src/main/cpp/
          test -f app/src/main/cpp/ncnn/arm64-v8a/lib/libncnn.a
          grep -q "int n;" app/src/main/cpp/ncnn/arm64-v8a/include/ncnn/mat.h \
            || { echo "vendored ncnn lacks batch support"; exit 1; }
          ls -l app/src/main/cpp/ncnn/arm64-v8a/lib
        env:
          UPSTREAM_SHA: '0a5ea3df054bb8933eeedd882236670247747afc'

      - name: Cache ncnn prebuilt
        id: ncnn-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ncnn
          key: ncnn-${{ env.NCNN_UPSTREAM_SHA }}

      - name: Fetch ncnn prebuilt from upstream PhotonCamera
        if: steps.ncnn-cache.outputs.cache-hit != 'true'
        run: |
          # CMakeLists silently falls back to a stub JNI library when
          # app/src/main/cpp/ncnn/<abi>/lib/libncnn.a is missing, which disables
          # FlowNet/KernelNet entirely. Upstream ships an ncnn fork with batch
          # support (Mat::n / Mat::nstep / Layer::support_batch) that the custom
          # FlowNet layers require; stock Tencent ncnn does not compile against
          # them. ~160 MB, so it is fetched and cached rather than committed.
          rm -rf /tmp/upstream
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/eszdman/PhotonCamera.git /tmp/upstream
          cd /tmp/upstream
          git fetch --depth 1 origin "$NCNN_UPSTREAM_SHA"
          git sparse-checkout set --no-cone app/src/main/cpp/ncnn
          git checkout "$NCNN_UPSTREAM_SHA"
          cd -
          mkdir -p app/src/main/cpp/ncnn
          cp -r /tmp/upstream/app/src/main/cpp/ncnn/. app/src/main/cpp/ncnn/

      - name: Verify ncnn is the batch-capable fork
        run: |
          test -f app/src/main/cpp/ncnn/arm64-v8a/lib/libncnn.a
          grep -q 'size_t nstep;' app/src/main/cpp/ncnn/arm64-v8a/include/ncnn/mat.h
          grep -q 'bool support_batch;' app/src/main/cpp/ncnn/arm64-v8a/include/ncnn/layer.h
          ls -l app/src/main/cpp/ncnn/arm64-v8a/lib

      - name: Check Vivo upscale failure handling
        run: |
          python3 tools/vivo-upscale/check_softpqe_worker.py
          python3 tools/vivo-upscale/check_softpqe_controls.py
          python3 tools/vivo-upscale/check_raisr_controls.py
          python3 tools/vivo-upscale/check_loader_order.py

      - name: Check original Multi-frame Remosaic binary
        run: |
          python3 -m venv /tmp/multiframe-check
          /tmp/multiframe-check/bin/pip install unicorn==2.1.4 pyelftools==0.32
          /tmp/multiframe-check/bin/python tools/multiframe/check_native.py

      - name: Check ZSL gyro exposure windows
        run: |
          mkdir -p /tmp/gyro-check
          javac -d /tmp/gyro-check app/src/main/java/com/particlesdevs/photoncamera/control/GyroBurst.java app/src/main/java/com/particlesdevs/photoncamera/control/GyroExposureWindow.java tools/java/GyroExposureWindowCheck.java
          java -cp /tmp/gyro-check GyroExposureWindowCheck

      - name: Check burst reference, focus and gyro blur
        run: |
          mkdir -p /tmp/burst-check
          javac -d /tmp/burst-check app/src/main/java/com/particlesdevs/photoncamera/capture/BurstFrameSelector.java app/src/main/java/com/particlesdevs/photoncamera/control/GyroBurst.java app/src/main/java/com/particlesdevs/photoncamera/control/GyroBlurEstimate.java tools/java/BurstFrameSelectorCheck.java
          java -cp /tmp/burst-check BurstFrameSelectorCheck

      - name: Check finish gain, noise and histogram AE
        run: |
          mkdir -p /tmp/finish-check
          javac -d /tmp/finish-check app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/GcamFinishMath.java app/src/main/java/com/particlesdevs/photoncamera/capture/SceneDistributionMeter.java tools/java/GcamFinishCheck.java
          java -cp /tmp/finish-check GcamFinishCheck

      - name: Check exposure factorization against GCam native results
        run: |
          mkdir -p /tmp/tet-check
          javac -d /tmp/tet-check app/src/main/java/com/particlesdevs/photoncamera/processing/parameters/TetModel.java tools/java/TetModelCheck.java
          java -cp /tmp/tet-check com.particlesdevs.photoncamera.processing.parameters.TetModelCheck tools/fixtures/gcam-tet.csv

      - name: Check settings precision and algorithm availability
        run: python3 tools/check_settings_model.py

      - name: Check Tetra response estimator
        run: |
          mkdir -p build/tetra-profile-check
          javac -d build/tetra-profile-check app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/TetraResponseProfile.java tools/TetraResponseProfileCheck.java tools/TetraResponseMapCheck.java
          java -cp build/tetra-profile-check TetraResponseProfileCheck
          java -cp build/tetra-profile-check TetraResponseMapCheck

      - name: Check neural packing and CFA gate
        run: |
          g++ -std=c++14 -O2 -Wall -Wextra -fsanitize=address,undefined tools/check_vivo_neural_capture.cpp -ldl -o /tmp/check-vivo-neural-capture
          /tmp/check-vivo-neural-capture
          g++ -pthread -std=c++17 -O2 -Wall -Wextra app/src/main/cpp/vivo-neural-worker.cpp -ldl -o /tmp/vivo-neural-worker
          /tmp/vivo-neural-worker --transport-check

      - name: Build debug APK
        # The APK build only starts after the native denoise behavior checks pass.
        env:
          SCAMERA_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfftw3-dev python3-numpy libegl1 libgl1-mesa-dri
          python3 -m venv /tmp/tetra-gpu-check
          /tmp/tetra-gpu-check/bin/pip install moderngl==5.12.0 numpy==2.3.5
          /tmp/tetra-gpu-check/bin/pip install ai-edge-litert==2.2.0
          /tmp/tetra-gpu-check/bin/python tools/check_saliency_model.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_arkcam_color.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_sabre_gpu.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_gcam_finish_gpu.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_vivo_hdr_gpu.py
          mkdir -p /tmp/zsl-quality-check
          javac -d /tmp/zsl-quality-check app/src/main/java/com/particlesdevs/photoncamera/capture/RawFrameQuality.java app/src/main/java/com/particlesdevs/photoncamera/capture/HexQuadZslSelector.java tools/java/RawFrameQualityCheck.java tools/java/HexQuadZslSelectorCheck.java
          java -ea -cp /tmp/zsl-quality-check RawFrameQualityCheck
          java -ea -cp /tmp/zsl-quality-check HexQuadZslSelectorCheck
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_tetra_gles.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_tetra_detail.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_remosaic_shaders.py
          /usr/bin/python3 tools/check_lanczos_downscale.py
          LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/python3 tools/checks/photo_look_gl.py
          /usr/bin/python3 tools/build_rt_host.py --fftw-include /usr/include --fftw-library /usr/lib/x86_64-linux-gnu/libfftw3f.so --output /tmp/rt-denoise.so
          /usr/bin/python3 tools/check_rt_denoise.py /tmp/rt-denoise.so
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_vivo_nice_preprocess.cpp -o /tmp/check-nice-preprocess
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-nice-preprocess
          g++ -std=c++17 -O2 -fsanitize=address,undefined tools/check_vivo_nice_capture.cpp -o /tmp/check-nice-capture
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-nice-capture
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_vivo_nice_probe.cpp -ldl -o /tmp/check-nice-probe
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-nice-probe /tmp/nice-probe-fixture
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests "com.particlesdevs.photoncamera.util.AsyncLogTest" --tests "com.particlesdevs.photoncamera.settings.SettingsMenuTest" --tests "com.particlesdevs.photoncamera.settings.ViewfinderUiTest" --tests "com.particlesdevs.photoncamera.settings.ApprovedConceptsTest" --tests "com.particlesdevs.photoncamera.processing.LiveRawFrameTest" --tests "com.particlesdevs.photoncamera.processing.LiveRawMeterTest" --tests "com.particlesdevs.photoncamera.capture.CameraResumeTest" --tests "com.particlesdevs.photoncamera.remosaic.BurstPolicyTest" --tests "com.particlesdevs.photoncamera.capture.PreviewFrameMatcherTest" --tests "com.particlesdevs.photoncamera.capture.TimestampFrameRouterTest" --tests "com.particlesdevs.photoncamera.processing.color.DcpProfileTest" --tests "com.particlesdevs.photoncamera.processing.parameters.HdrBracketFactorsTest" :app:assembleDebug --stacktrace --no-daemon

      - name: Upload settings test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/viewfinder
            app/build/reports/module-concept
          if-no-files-found: ignore

      - name: Verify native denoise packaging
        env:
          SCAMERA_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/libmobileRemosaic.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/librtDenoise.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/liblanczosDownscale.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'assets/vivo-neural/arm64-v8a/vivo-neural-worker'
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          unzip -p "$APK" assets/vivo-neural/arm64-v8a/vivo-neural-worker > /tmp/vivo-neural-worker-android
          readelf -h /tmp/vivo-neural-worker-android | grep AArch64
          readelf -l /tmp/vivo-neural-worker-android | grep /system/bin/linker64
          readelf -d /tmp/vivo-neural-worker-android > /tmp/neural-deps.txt
          grep -q PIE /tmp/neural-deps.txt
          cat /tmp/neural-deps.txt
          if grep -q 'libc++_shared.so' /tmp/neural-deps.txt; then
            echo "Root helper must have a static C++ runtime"
            exit 1
          fi
          unzip -p "$APK" assets/vivo-upscale/arm64-v8a/vivo-upscale-worker > /tmp/vivo-upscale-worker-android
          readelf -h /tmp/vivo-upscale-worker-android | grep AArch64
          readelf -l /tmp/vivo-upscale-worker-android | grep /system/bin/linker64
          readelf -d /tmp/vivo-upscale-worker-android > /tmp/upscale-deps.txt
          grep -q PIE /tmp/upscale-deps.txt
          if grep -q 'libc++_shared.so' /tmp/upscale-deps.txt; then
            echo "Upscale helper must have a static C++ runtime"
            exit 1
          fi
          unzip -p "$APK" assets/vivo-upscale/softpqe-master.sha256 | grep -q libvivo_softpqe.so
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$APK" --file res/xml/preferences.xml > /tmp/apk-preferences.txt
          grep -q 'rt_denoise_screen' /tmp/apk-preferences.txt
          grep -q 'pref_rt_denoise_backend' /tmp/apk-preferences.txt
          grep -q 'rt_original_controls' /tmp/apk-preferences.txt
          grep -q 'rt512_luma' /tmp/apk-preferences.txt
          grep -q 'rt512_ccurve' /tmp/apk-preferences.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -1

      # CI emits a template; private model/runtime assets are added and signed
      # with tools/package_vivo_neural.py before delivering a Bundled APK.
      - name: Collect APK template
        run: |
          mkdir -p out
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} out/ \;
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-template-${{ steps.ver.outputs.code }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
