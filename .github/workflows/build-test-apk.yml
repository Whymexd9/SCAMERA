name: Build SCAMERA test APK

on:
  push:
    branches: [ main, work, codex/zsl-bracket-completion, migration/nice-camera2 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    # The port branch builds on push; avoid a duplicate APK for its PR event.
    if: github.head_ref != 'codex/zsl-bracket-completion' && github.head_ref != 'migration/nice-camera2'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Versioning uses the documented source baseline below.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action installs the obsolete "tools" package by default; it no
      # longer exists in current cmdline-tools and sdkmanager exits 1 on it,
      # which started failing every build. Everything needed is installed in
      # the step below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute versionCode
        id: ver
        # Reserve versions delivered locally; increment from the last published source baseline.
        run: echo "code=$((30196 + $(git rev-list --count c2d9e9bc4bf3d13467e48d86faad6a748e33ddcb..HEAD)))" >> "$GITHUB_OUTPUT"

      - name: Check original Multi-frame Remosaic binary
        run: |
          python3 -m venv /tmp/multiframe-check
          /tmp/multiframe-check/bin/pip install unicorn==2.1.4 pyelftools==0.32
          /tmp/multiframe-check/bin/python tools/multiframe/check_native.py

      - name: Check ZSL gyro exposure windows
        run: |
          mkdir -p /tmp/gyro-check
          javac -d /tmp/gyro-check app/src/main/java/com/particlesdevs/photoncamera/control/GyroBurst.java app/src/main/java/com/particlesdevs/photoncamera/control/GyroExposureWindow.java tools/java/GyroExposureWindowCheck.java
          java -cp /tmp/gyro-check GyroExposureWindowCheck

      - name: Check settings precision and algorithm availability
        run: python3 tools/check_settings_model.py

      - name: Check UI language (English defaults, Russian in values-ru, Java text through Lang)
        run: python3 tools/check_ui_language.py

      - name: Check Ultra HDR container (MPF, GContainer XMP, gain map metadata, both images decode)
        run: python3 tools/check_ultrahdr.py --self-test

      - name: Check 10-bit HEIC container (x265 Main10 tiles wrapped by the app's writer, libheif decode at 10 bits, Exif)
        run: |
          python3 -m venv /tmp/heic10-check
          /tmp/heic10-check/bin/pip install pillow-heif==1.8.0 numpy==2.3.5
          /tmp/heic10-check/bin/python tools/check_heic10.py --self-test

      - name: Check Display P3 / HDR colour output (P46; shader unchanged by default, ICC in JPEG / WebP / HEIF, HLG maths)
        run: /tmp/heic10-check/bin/python tools/check_colour_output.py --shader --files --strict

      - name: Check AVIF output (the app's encoder built for the host; 8/10/12-bit, 4:4:4/4:2:0, lossless, EXIF, nclx, Display P3 / HLG; decoded by Pillow/dav1d)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm ninja-build
          python3 -m venv /tmp/avif-check
          /tmp/avif-check/bin/pip install pillow==12.3.0 numpy==2.3.5
          /tmp/avif-check/bin/python tools/check_avif.py

      - name: Check Tetra response estimator
        run: |
          mkdir -p build/tetra-profile-check
          javac -d build/tetra-profile-check app/src/main/java/com/particlesdevs/photoncamera/processing/opengl/postpipeline/TetraResponseProfile.java tools/TetraResponseProfileCheck.java tools/TetraResponseMapCheck.java
          java -cp build/tetra-profile-check TetraResponseProfileCheck
          java -cp build/tetra-profile-check TetraResponseMapCheck

      - name: Check neural packing and CFA gate
        run: |
          g++ -std=c++14 -O2 -Wall -Wextra -fsanitize=address,undefined tools/check_scam_neural_capture.cpp -ldl -o /tmp/check-scam-neural-capture
          /tmp/check-scam-neural-capture
          # The worker includes the EGL/GLES GPU helpers (hexquad / super-resolution).
          sudo apt-get update -qq
          sudo apt-get install -y libegl-dev libgles-dev
          g++ -pthread -std=c++17 -O2 -Wall -Wextra app/src/main/cpp/scam-neural-worker.cpp -ldl -lEGL -lGLESv2 -o /tmp/scam-neural-worker
          /tmp/scam-neural-worker --transport-check

      - name: Build debug APK
        # The APK build only starts after the host checks pass.
        env:
          SCAMERA_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          python3 tools/fetch_scam_ae_runtime.py
          node tools/scam-zsl-live/check_ae_solver_context.js
          python3 tools/check_scam_legacy_isolation.py
          python3 tools/check_scam_ae_context.py
          python3 tools/check_scam_measured_exposure.py
          python3 tools/check_scam_capture_sequence.py
          sudo apt-get update -qq
          sudo apt-get install -y python3-numpy libegl1 libgl1-mesa-dri libegl-dev libgles-dev
          python3 -m venv /tmp/tetra-gpu-check
          /tmp/tetra-gpu-check/bin/pip install moderngl==5.12.0 numpy==2.3.5
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_scam_hdr_gpu.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_ark_highlights.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_recovery.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_neutral.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_one_channel_off.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_hybrid_mochi.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_signed_rgb.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_effmap_onesided.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_dark_fade.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_colour_output.py --gl --strict
          mkdir -p /tmp/zsl-quality-check
          javac -d /tmp/zsl-quality-check app/src/main/java/com/particlesdevs/photoncamera/capture/RawFrameQuality.java tools/java/RawFrameQualityCheck.java
          java -ea -cp /tmp/zsl-quality-check RawFrameQualityCheck
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_tetra_gles.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_tetra_detail.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_remosaic_shaders.py
          /usr/bin/python3 tools/check_lanczos_downscale.py
          LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/python3 tools/checks/photo_look_gl.py
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_scam_preprocess.cpp -lEGL -lGLESv2 -o /tmp/check-scam-preprocess
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-preprocess
          g++ -std=c++17 -O2 -fsanitize=address,undefined tools/check_scam_capture.cpp -lEGL -lGLESv2 -o /tmp/check-scam-capture
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-capture
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_scam_motion_capture.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-scam-motion-capture
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-motion-capture
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_measured_gain.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-measured-gain
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-measured-gain
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_prefetch.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-prefetch
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-prefetch
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_native_widen.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-native-widen
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-native-widen
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_scam_probe.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-scam-probe
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-probe /tmp/scam-probe-fixture
          python3 tools/check_scam_reference_metadata.py
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests "com.particlesdevs.photoncamera.util.AsyncLogTest" --tests "com.particlesdevs.photoncamera.settings.SettingsMenuTest" --tests "com.particlesdevs.photoncamera.settings.ViewfinderUiTest" --tests "com.particlesdevs.photoncamera.settings.ApprovedConceptsTest" --tests "com.particlesdevs.photoncamera.processing.LiveRawFrameTest" --tests "com.particlesdevs.photoncamera.processing.LiveRawMeterTest" --tests "com.particlesdevs.photoncamera.processing.RawPayloadCheckTest" --tests "com.particlesdevs.photoncamera.settings.BackupLensMatchTest" --tests "com.particlesdevs.photoncamera.settings.DeviceDefaultsTest" --tests "com.particlesdevs.photoncamera.capture.CameraResumeTest" --tests "com.particlesdevs.photoncamera.capture.ScamStockAePlanTest" --tests "com.particlesdevs.photoncamera.capture.HybridPlanTest" --tests "com.particlesdevs.photoncamera.capture.ExposureLimitsTest" --tests "com.particlesdevs.photoncamera.capture.FlushLossStatsTest" --tests "com.particlesdevs.photoncamera.processing.RawBinTest" --tests "com.particlesdevs.photoncamera.processing.opengl.postpipeline.ScamHybridBurstAnyResolutionTest" --tests "com.particlesdevs.photoncamera.processing.opengl.postpipeline.ScamHybridBurstRolesTest" --tests "com.particlesdevs.photoncamera.processing.opengl.postpipeline.ScamNoiseFactorReportTest" --tests "com.particlesdevs.photoncamera.capture.ZslSteadiestTest" --tests "com.particlesdevs.photoncamera.util.ScameraTimingLogTest" --tests "com.particlesdevs.photoncamera.remosaic.BurstPolicyTest" --tests "com.particlesdevs.photoncamera.capture.PreviewFrameMatcherTest" --tests "com.particlesdevs.photoncamera.capture.TimestampFrameRouterTest" --tests "com.particlesdevs.photoncamera.processing.color.DcpProfileTest" --tests "com.particlesdevs.photoncamera.settings.ShadeCatalogTest" --tests "com.particlesdevs.photoncamera.settings.ShadeTilesTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.settingsbar.ShadeUiTest" --tests "com.particlesdevs.photoncamera.util.LangTest" --tests "com.particlesdevs.photoncamera.settings.QuadBayerResetTest" --tests "com.particlesdevs.photoncamera.settings.HybridSettingsTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.LensLabelLocaleTest" --tests "com.particlesdevs.photoncamera.ui.camera.PermissionPlanTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.LensButtonTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.BottomChromeTest" --tests "com.particlesdevs.photoncamera.processing.opengl.postpipeline.ShotSpeedBitExactTest" --tests "com.particlesdevs.photoncamera.processing.MosaicBlockDetectorSpeedTest" --tests "com.particlesdevs.photoncamera.processing.render.ParametersBlackFloorTest" --tests "com.particlesdevs.photoncamera.processing.opengl.postpipeline.ScamHybridBurstCrashTest" --tests "com.particlesdevs.photoncamera.control.ZoomControllerRangeTest" --tests "com.particlesdevs.photoncamera.processing.MosaicBlockStoreTest" --tests "com.particlesdevs.photoncamera.settings.ModuleChoiceTest" --tests "com.particlesdevs.photoncamera.capture.XiaomiTeleZoomTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.ZoomDialDetentTest" --tests "com.particlesdevs.photoncamera.processing.PhotoFormatTest" --tests "com.particlesdevs.photoncamera.settings.PhotoFormatSettingsTest" --tests "com.particlesdevs.photoncamera.processing.AvifOutputTest" --tests "com.particlesdevs.photoncamera.settings.AvifSettingsTest" --tests "com.particlesdevs.photoncamera.processing.ultrahdr.UltraHdrContainerStreamTest" --tests "com.particlesdevs.photoncamera.processing.ultrahdr.GainMapComputerTest" --tests "com.particlesdevs.photoncamera.manual.ParamControllerEvLockTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.ManualFormatTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.ManualPanelUiTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.ManualRulerTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.ManualRangeTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.TopBarSummaryTest" --tests "com.particlesdevs.photoncamera.settings.FormatChoiceTest" --tests "com.particlesdevs.photoncamera.capture.SafeStreamSizesTest" --tests "com.particlesdevs.photoncamera.capture.StabilizationTraceTest" --tests "com.particlesdevs.photoncamera.capture.ScamPreviewTest" --tests "com.particlesdevs.photoncamera.capture.ForcedStabilizationTest" --tests "com.particlesdevs.photoncamera.settings.BrandMigrationTest" --tests "com.particlesdevs.photoncamera.capture.PreviewStallTest" --tests "com.particlesdevs.photoncamera.control.SubjectMappingTest" --tests "com.particlesdevs.photoncamera.control.subject.FaceDetectModesTest" --tests "com.particlesdevs.photoncamera.control.subject.SubjectPolicyTest" --tests "com.particlesdevs.photoncamera.control.subject.PatchTrackerTest" --tests "com.particlesdevs.photoncamera.processing.heif.HevcNalTest" --tests "com.particlesdevs.photoncamera.processing.heif.HeifContainerWriterTest" --tests "com.particlesdevs.photoncamera.processing.heif.P010Test" --tests "com.particlesdevs.photoncamera.processing.heif.TileGridTest" --tests "com.particlesdevs.photoncamera.processing.heif.Heic10SupportTest" --tests "com.particlesdevs.photoncamera.processing.heif.TenBitBitmapsTest" --tests "com.particlesdevs.photoncamera.processing.ml.Lanczos1010102Test" --tests "com.particlesdevs.photoncamera.processing.opengl.TenBitReadbackTest" --tests "com.particlesdevs.photoncamera.processing.PhotoOutputHeic10Test" --tests "com.particlesdevs.photoncamera.settings.SettingsAuditFixTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.ViewfinderScaleLayoutTest" --tests "com.particlesdevs.photoncamera.capture.PreviewGapMeterTest" --tests "com.particlesdevs.photoncamera.capture.PreviewContinuityTest" --tests "com.particlesdevs.photoncamera.processing.opengl.postpipeline.PlainShotSpeedTest" --tests "com.particlesdevs.photoncamera.control.ZoomStreamCropTest" --tests "com.particlesdevs.photoncamera.processing.opengl.postpipeline.ScamRgbOneChannelOffTest" --tests "com.particlesdevs.photoncamera.ui.camera.views.viewfinder.VfDrawMeterTest" --tests "com.particlesdevs.photoncamera.control.FovSelfCheckTest" --tests "com.particlesdevs.photoncamera.gallery.dng.DngPreviewTest" --tests "com.particlesdevs.photoncamera.gallery.GalleryLauncherIconTest" --tests "com.particlesdevs.photoncamera.gallery.ui.GalleryUiTest" --tests "com.particlesdevs.photoncamera.gallery.glide.AvifGlideDecoderTest" --tests "com.particlesdevs.photoncamera.api.CameraLensScanTest" --tests "com.particlesdevs.photoncamera.processing.opengl.GLProgramDiskCacheTest" --tests "com.particlesdevs.photoncamera.gallery.adapters.GalleryDecodeRetryTest" --tests "com.particlesdevs.photoncamera.processing.color.OutputColourTest" --tests "com.particlesdevs.photoncamera.processing.color.IccProfilesTest" --tests "com.particlesdevs.photoncamera.processing.color.IccEmbedTest" --tests "com.particlesdevs.photoncamera.processing.color.HlgRenditionTest" --tests "com.particlesdevs.photoncamera.processing.color.DefaultOutputGoldenTest" --tests "com.particlesdevs.photoncamera.processing.heif.HeifColourTest" --tests "com.particlesdevs.photoncamera.processing.PhotoOutputColourTest" --tests "com.particlesdevs.photoncamera.settings.ColourSettingsTest" :app:assembleDebug --stacktrace --no-daemon

      - name: Upload settings test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/viewfinder
            app/build/reports/module-concept
          if-no-files-found: ignore

      - name: Verify native packaging and settings
        env:
          SCAMERA_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/libmobileRemosaic.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/liblanczosDownscale.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/libscameraAvif.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'assets/scam-neural/arm64-v8a/scam-neural-worker'
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          python3 tools/fetch_scam_ae_runtime.py --apk "$APK"
          unzip -p "$APK" assets/scam-neural/arm64-v8a/scam-neural-worker > /tmp/scam-neural-worker-android
          readelf -h /tmp/scam-neural-worker-android | grep AArch64
          readelf -l /tmp/scam-neural-worker-android | grep /system/bin/linker64
          readelf -d /tmp/scam-neural-worker-android > /tmp/neural-deps.txt
          grep -q PIE /tmp/neural-deps.txt
          cat /tmp/neural-deps.txt
          if grep -q 'libc++_shared.so' /tmp/neural-deps.txt; then
            echo "Root helper must have a static C++ runtime"
            exit 1
          fi
          # The shipped (non-debuggable) variant shortens resource paths: resolve the real one.
          PREFS_PATH=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$APK" | grep -A1 'xml/preferences$' | grep -o 'res/[^ ]*\.xml' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$APK" --file "$PREFS_PATH" > /tmp/apk-preferences.txt
          grep -q 'pref_merge_route' /tmp/apk-preferences.txt
          grep -q 'scam_hybrid_screen' /tmp/apk-preferences.txt
          grep -q 'scam_hdr_screen' /tmp/apk-preferences.txt
          grep -q 'output_settings_screen' /tmp/apk-preferences.txt
          if grep -q 'rt_denoise_screen\|gcam_finish_screen\|aces_group_screen' /tmp/apk-preferences.txt; then
            echo "Removed legacy post-processing screens are back"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -1

      # Private vendor binaries stay out of git. A secret bootstraps the
      # pinned bundle once; subsequent builds restore the verified artifact.
      - name: Restore and verify private neural assets
        env:
          GH_TOKEN: ${{ github.token }}
          SCAMERA_NEURAL_ASSETS_URL: ${{ secrets.SCAMERA_NEURAL_ASSETS_URL }}
          SCAMERA_NEURAL_ASSETS_KEY_V2: ${{ secrets.SCAMERA_NEURAL_ASSETS_KEY_V2 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asset-tools"
          "$RUNNER_TEMP/asset-tools/bin/pip" install cryptography==46.0.0
          "$RUNNER_TEMP/asset-tools/bin/python" tools/ci_neural_assets.py --output "$RUNNER_TEMP/neural-assets"

      - name: Package and sign the final APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          python3 tools/package_scam_neural.py \
            --template "$APK" \
            --bundle-dir "$RUNNER_TEMP/neural-assets/bundle" \
            --hexquad-dir "$RUNNER_TEMP/neural-assets/hexquad" \
            --scam-dir "$RUNNER_TEMP/neural-assets/nice" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" \
            --output "out/SCAMERA-0.98-${{ steps.ver.outputs.code }}-SCAM.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-neural-assets-v2
          path: ${{ runner.temp }}/neural-assets/scamera-neural-assets-v2.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Build-${{ steps.ver.outputs.code }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
