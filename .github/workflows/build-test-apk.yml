name: Build SCAMERA test APK

# Actions minutes and artifact storage are budgeted: builds run for main only (no PR or stale-branch duplicates, docs-only
# pushes skipped), a newer push cancels the running build, and the artifacts are kept for days, not the 90-day default.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'docs/**', 'research/**' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # the longest successful build of the last month took 41 min
    env:
      # ci_neural_assets.py decrypts the bundle from git with this key and never reads the artifact copy then
      HAS_NEURAL_KEY: ${{ secrets.SCAMERA_NEURAL_ASSETS_KEY_V2 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Versioning uses the documented source baseline below.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action installs the obsolete "tools" package by default; it no
      # longer exists in current cmdline-tools and sdkmanager exits 1 on it,
      # which started failing every build. Everything needed is installed in
      # the step below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute versionCode
        id: ver
        # Reserve versions delivered locally; increment from the last published source baseline.
        run: echo "code=$((30196 + $(git rev-list --count c2d9e9bc4bf3d13467e48d86faad6a748e33ddcb..HEAD)))" >> "$GITHUB_OUTPUT"

      - name: Check ZSL gyro exposure windows
        run: |
          mkdir -p /tmp/gyro-check
          javac -d /tmp/gyro-check app/src/main/java/com/particlesdevs/photoncamera/control/GyroBurst.java app/src/main/java/com/particlesdevs/photoncamera/control/GyroExposureWindow.java tools/java/GyroExposureWindowCheck.java
          java -cp /tmp/gyro-check GyroExposureWindowCheck

      - name: Check settings precision and algorithm availability
        run: |
          python3 tools/check_settings_model.py
          python3 tools/make_ui_icons.py --check

      - name: Check UI language (English defaults, Russian in values-ru, Java text through Lang)
        run: python3 tools/check_ui_language.py

      - name: Check Ultra HDR container (MPF, GContainer XMP, gain map metadata, both images decode)
        run: python3 tools/check_ultrahdr.py --self-test

      - name: Check 10-bit HEIC container (x265 Main10 tiles wrapped by the app's writer, libheif decode at 10 bits, Exif)
        run: |
          python3 -m venv /tmp/heic10-check
          /tmp/heic10-check/bin/pip install pillow-heif==1.8.0 numpy==2.3.5
          /tmp/heic10-check/bin/python tools/check_heic10.py --self-test

      - name: Check Display P3 / HDR colour output (P46; shader unchanged by default, ICC in JPEG / WebP / HEIF, HLG maths)
        run: /tmp/heic10-check/bin/python tools/check_colour_output.py --shader --files --strict

      - name: Check AVIF output (the app's encoder built for the host; 8/10/12-bit, 4:4:4/4:2:0, lossless, EXIF, nclx, Display P3 / HLG; decoded by Pillow/dav1d)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm ninja-build
          python3 -m venv /tmp/avif-check
          /tmp/avif-check/bin/pip install pillow==12.3.0 numpy==2.3.5
          /tmp/avif-check/bin/python tools/check_avif.py

      - name: Check the merge worker builds and starts on the host
        run: |
          # The worker includes the EGL/GLES GPU helpers (SHDR merge / super-resolution).
          sudo apt-get update -qq
          sudo apt-get install -y libegl-dev libgles-dev
          g++ -pthread -std=c++17 -O2 -Wall -Wextra app/src/main/cpp/scam-neural-worker.cpp -ldl -lEGL -lGLESv2 -o /tmp/scam-neural-worker
          /tmp/scam-neural-worker --transport-check

      - name: Build debug APK
        # The APK build only starts after the host checks pass.
        env:
          SCAMERA_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          node tools/scam-zsl-live/check_ae_solver_context.js
          python3 tools/check_scam_legacy_isolation.py
          python3 tools/check_scam_ae_context.py
          python3 tools/check_scam_capture_sequence.py
          # P317: no mediump (fp16 on Mali) shader operation with a constant outside the fp16 range (NDK glslc)
          python3 tools/check_shader_fp16.py
          sudo apt-get update -qq
          sudo apt-get install -y python3-numpy libegl1 libgl1-mesa-dri libegl-dev libgles-dev
          python3 -m venv /tmp/tetra-gpu-check
          /tmp/tetra-gpu-check/bin/pip install moderngl==5.12.0 numpy==2.3.5
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_scam_hdr_gpu.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_highlights.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_pyramid.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_pyramid_edge.py
          # P391: the pyramid's edge-aware bands and continuous depth; the noise-bound deep floor and band cap
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_pyramid_bands.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_noise.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_sky.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_vibrance_hl.py
          # P395: the saturated orange-yellows towards yellow (skin, oranges, pale colours, greens, blues bit for bit)
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_yellow_hue.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_luma_grain.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_sharpen.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_headroom.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_recovery.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_neutral.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_opposed.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_one_channel_off.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_ceiling.py
          # P393: a clipped channel of sunlit foliage without ultrashort content from the local light (scamhdr/scamrgb oppLocalU)
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_opposed_foliage.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_hybrid_mochi.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_hybrid_outlier_cap.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_signed_rgb.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_effmap_onesided.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_dark_fade.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_colour_output.py --gl --strict
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_colour_look.py
          # P370: the same with the signed hue on (signedHueU 1, the shipped default); the other GL checks render both themselves
          SIGNED_HUE=1 LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_colour_output.py --gl --strict
          SIGNED_HUE=1 LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_colour_look.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_ccm_gamut.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_ccm_chain.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_tone_ops.py
          # P393: a saturated colour's light tones keep its mid-tone chroma (why/combine LIGHT_CHROMA 1; 0 is the shader before, token for token)
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_light_chroma.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_film_lut.py
          # P369: the film fed scene light (why/combine FILM_SIM 1); FILM_SIM 0 is the shader without it, token for token
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_film_sim.py --strict
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_highlight_landing.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_viewfinder_look.py
          # P365: the RAW viewfinder's fused WHY pass against P314's passes; RAW_SOURCE 0 is the photo's combine token for token
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_vf_fused.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_why_ae_gpu.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_half_rgba.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_gainmap_gpu.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_ultrahdr.py --scene-luma
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_rotate.py
          LIBGL_ALWAYS_SOFTWARE=1 /tmp/tetra-gpu-check/bin/python tools/check_linear_resize.py
          mkdir -p /tmp/zsl-quality-check
          javac -d /tmp/zsl-quality-check app/src/main/java/com/particlesdevs/photoncamera/capture/RawFrameQuality.java tools/java/RawFrameQualityCheck.java
          java -ea -cp /tmp/zsl-quality-check RawFrameQualityCheck
          /usr/bin/python3 tools/check_lanczos_downscale.py
          cmake -S tools/jpeg-check -B /tmp/jpeg-check -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/jpeg-check -j 4
          /tmp/jpeg-check/scamera-jpeg-check 2592 1944 95 4 - /tmp && /tmp/jpeg-check/scamera-jpeg-check 1000 3000 100 3 - /tmp
          g++ -std=c++17 -O1 -fsanitize=address tools/check_dng_memory.cpp -o /tmp/check-dng-memory
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-dng-memory /tmp
          LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/python3 tools/checks/preview_gl.py
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_scam_preprocess.cpp -lEGL -lGLESv2 -o /tmp/check-scam-preprocess
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-preprocess
          g++ -std=c++17 -O2 -fsanitize=address,undefined tools/check_scam_capture.cpp -lEGL -lGLESv2 -o /tmp/check-scam-capture
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-capture
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_scam_motion_capture.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-scam-motion-capture
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-motion-capture
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_measured_gain.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-measured-gain
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-measured-gain
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_prefetch.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-prefetch
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-prefetch
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_native_widen.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-native-widen
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-native-widen
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_fullres_2x.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-fullres-2x
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-fullres-2x
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_mosaic_chroma_bands.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-mosaic-chroma-bands
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-mosaic-chroma-bands
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined -DSCAM_CHROMA_RING_CHECK tools/check_chroma_band.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-chroma-band
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-chroma-band quick
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined -DSCAM_CHROMA_RING_CHECK tools/check_chroma_overlap.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-chroma-overlap
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-chroma-overlap quick
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_still.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-still
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-still
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_stages.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-stages
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-stages
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_series.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-series
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-series
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_us_rows.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-us-rows
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-us-rows
          # P366: the lamp-flicker corrections of the ultrashort frames held in daylight and for an incoherent tile field (one decision per burst)
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_us_daylight.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-us-daylight
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-us-daylight
          # P364: a merge that throws while the ultrashort check runs beside it waits for the check before its copies are freed
          # (ASan: the use after free; TSan, setarch -R for its fixed shadow layout: the missing join, whatever the timing)
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_us_pending.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-us-pending
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-us-pending
          g++ -pthread -std=c++17 -O1 -g -D_GLIBCXX_ASSERTIONS -fsanitize=thread tools/check_hybrid_us_pending.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-us-pending-tsan
          setarch "$(uname -m)" -R /tmp/check-hybrid-us-pending-tsan
          # P364: the GPU homography and field on their error paths (no broken promise, no slot off by one) and the memory they hold
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined -DSCAM_LA_GPU_FAULTS tools/check_la_gpu_errors.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-la-gpu-errors
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless ASAN_OPTIONS=detect_leaks=0 /tmp/check-la-gpu-errors
          # P364: the plain merge with the GPU alignment under ThreadSanitizer (no race on the ultrashort registration's state), the
          # GPU field's memory guard with the homography counted, and a GPU field fault mid-burst (the merge goes on: the frames the
          # failed worker left by the global translation, the CPU field)
          g++ -pthread -std=c++17 -O1 -g -D_GLIBCXX_ASSERTIONS -fsanitize=thread -DSCAM_LA_GPU_FAULTS tools/check_hybrid_gpu_align.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-gpu-align
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless TSAN_OPTIONS="suppressions=$PWD/tools/check_hybrid_gpu_align.tsan.supp" setarch "$(uname -m)" -R /tmp/check-hybrid-gpu-align
          # P337: the lateral CA beyond the old 2-cell cut (R +6 / B -3 px at the corner) measured and corrected
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_hybrid_raw_ca.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-hybrid-raw-ca
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-hybrid-raw-ca
          # P219: the mosaic merges' frame pick (the split unchanged, the native merge takes every frame) and the skipped detector
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_mosaic_pick.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-mosaic-pick
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-mosaic-pick
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_dng_ceiling.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-dng-ceiling
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-dng-ceiling
          # P268: the site response field of the mosaic merges (2x2-OCL Quad sensors)
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_gain_field.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-gain-field
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-gain-field
          # P220: the merge worker's heartbeat (scam-progress.h) that the app's watchdog and processing ring read
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_worker_progress.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-worker-progress
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-worker-progress
          # P371: the worker's RGB halves streamed into the output memfd during the merge (scam-stream-out.h, the plain sink's rows)
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined tools/check_stream_out.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-stream-out
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-stream-out
          g++ -std=c++17 -O1 -fsanitize=address,undefined tools/check_scam_probe.cpp -ldl -lEGL -lGLESv2 -o /tmp/check-scam-probe
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-scam-probe /tmp/scam-probe-fixture
          # P214a: NativeEngine lookups leave no JNI global reference (fake JNIEnv against the NDK's jni.h).
          mkdir -p /tmp/native-engine-host && cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/jni.h" /tmp/native-engine-host/
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined -I/tmp/native-engine-host tools/check_native_engine_refs.cpp -ldl -o /tmp/check-native-engine-refs
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-native-engine-refs
          # P318: a Quad / Tetra mosaic DNG declares its CFA, black level and GainMap sites over the colour blocks; every CFA order
          # keeps its colour tags (the 4-byte CFA array overflow)
          g++ -std=c++17 -O1 -fsanitize=address,undefined -fno-sanitize-recover=bounds -I/tmp/native-engine-host -Itools/host-include -Iapp/src/main/cpp/deps tools/check_dng_mosaic_cfa.cpp -ldl -o /tmp/check-dng-mosaic-cfa
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-dng-mosaic-cfa
          # P371: the merge client reads the worker's result in place (allocator.cpp arenaAdopt: views of the memfd, the RGB view's
          # free punches its pages, unmapped after the last view; review B1: the trailers between the views survive the release)
          g++ -pthread -std=c++17 -O1 -fsanitize=address,undefined -I/tmp/native-engine-host -Itools/host-include tools/check_allocator_adopt.cpp -o /tmp/check-allocator-adopt
          ASAN_OPTIONS=detect_leaks=0 /tmp/check-allocator-adopt
          g++ -std=c++17 -O1 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all tools/check_dcg_noise.cpp -o /tmp/check-dcg-noise
          /tmp/check-dcg-noise
          python3 tools/check_scam_reference_metadata.py
