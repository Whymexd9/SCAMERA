      - name: Upload settings test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: settings-test-reports
          retention-days: 3
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/viewfinder
            app/build/reports/module-concept
          if-no-files-found: ignore

      - name: Verify native packaging and settings
        env:
          SCAMERA_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/liblanczosDownscale.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'lib/arm64-v8a/libscameraAvif.so'
          unzip -l app/build/outputs/apk/debug/*.apk | grep 'assets/scam-neural/arm64-v8a/scam-neural-worker'
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          # P129: SCAM HDR's stock AE (Frida observer, libscamAe) and the Multi-frame Remosaic are gone with SCAM HDR
          if unzip -l "$APK" | grep -q 'assets/scam-aec/\|libscamAe.so\|libscamProbe.so\|libmobileRemosaic.so'; then
            echo "SCAM HDR runtime is back in the APK"
            exit 1
          fi
          unzip -p "$APK" assets/scam-neural/arm64-v8a/scam-neural-worker > /tmp/scam-neural-worker-android
          readelf -h /tmp/scam-neural-worker-android | grep AArch64
          readelf -l /tmp/scam-neural-worker-android | grep /system/bin/linker64
          readelf -d /tmp/scam-neural-worker-android > /tmp/neural-deps.txt
          grep -q PIE /tmp/neural-deps.txt
          cat /tmp/neural-deps.txt
          if grep -q 'libc++_shared.so' /tmp/neural-deps.txt; then
            echo "Root helper must have a static C++ runtime"
            exit 1
          fi
          # The shipped (non-debuggable) variant shortens resource paths: resolve the real one.
          PREFS_PATH=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$APK" | grep -A1 'xml/preferences$' | grep -o 'res/[^ ]*\.xml' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$APK" --file "$PREFS_PATH" > /tmp/apk-preferences.txt
          grep -q 'scam_hybrid_screen' /tmp/apk-preferences.txt
          grep -q 'advanced_screen' /tmp/apk-preferences.txt   # SIMPLE_UI §4: «Для опытных» (the shooting page is gone)
          grep -q 'output_settings_screen' /tmp/apk-preferences.txt
          # P129: SHDR is the only merge: no SCAM HDR screen, no route row
          if grep -q 'scam_hdr_screen\|pref_merge_route' /tmp/apk-preferences.txt; then
            echo "SCAM HDR settings are back"
            exit 1
          fi
          if grep -q 'rt_denoise_screen\|gcam_finish_screen\|aces_group_screen' /tmp/apk-preferences.txt; then
            echo "Removed legacy post-processing screens are back"
            exit 1
          fi
          # P175: the neural remosaic (its page, its switch and its check) is gone
          if grep -q 'shdr_neural_remosaic_screen\|pref_scam_hybrid_neural_remosaic\|scam_neural_probe' /tmp/apk-preferences.txt; then
            echo "Neural remosaic settings are back"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -1

      # Private vendor binaries stay out of git: decrypted from the neural-assets-v2 branch with a secret key; without
      # the key a URL secret bootstraps the pinned bundle once and later builds restore the verified artifact.
      - name: Restore and verify private neural assets
        env:
          GH_TOKEN: ${{ github.token }}
          SCAMERA_NEURAL_ASSETS_URL: ${{ secrets.SCAMERA_NEURAL_ASSETS_URL }}
          SCAMERA_NEURAL_ASSETS_KEY_V2: ${{ secrets.SCAMERA_NEURAL_ASSETS_KEY_V2 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asset-tools"
          "$RUNNER_TEMP/asset-tools/bin/pip" install cryptography==46.0.0
          "$RUNNER_TEMP/asset-tools/bin/python" tools/ci_neural_assets.py --output "$RUNNER_TEMP/neural-assets"

      # The SCAMERA release key is not in the repository (it is public): a base64 .jks and its password as secrets.
      - name: Package and sign the final APK
        env:
          SCAMERA_SIGNING_KEYSTORE: ${{ secrets.SCAMERA_SIGNING_KEYSTORE }}
          SCAMERA_KEYSTORE_PASSWORD: ${{ secrets.SCAMERA_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SCAMERA_SIGNING_KEYSTORE" ] || [ -z "$SCAMERA_KEYSTORE_PASSWORD" ]; then
            echo "::error::The SCAMERA signing key is missing: secrets SCAMERA_SIGNING_KEYSTORE and SCAMERA_SIGNING_PASSWORD (key/README.md)"
            exit 1
          fi
          export SCAMERA_KEYSTORE="$RUNNER_TEMP/scamera-release.jks" SCAMERA_KEY_ALIAS=scamera
          printf '%s' "$SCAMERA_SIGNING_KEYSTORE" | base64 -d > "$SCAMERA_KEYSTORE"
          mkdir -p out
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          python3 tools/package_scam_neural.py \
            --template "$APK" \
            --hexquad-dir "$RUNNER_TEMP/neural-assets/hexquad" \
            --scam-dir "$RUNNER_TEMP/neural-assets/nice" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" \
            --output "out/SCAMERA-0.98-${{ steps.ver.outputs.code }}-SCAM.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.HAS_NEURAL_KEY != 'true'
        with:
          name: SCAMERA-neural-assets-v2
          path: ${{ runner.temp }}/neural-assets/scamera-neural-assets-v2.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: SCAMERA-Build-${{ steps.ver.outputs.code }}
          path: out/*
          if-no-files-found: error
          retention-days: 3       # the APK itself goes to Telegram; /post <n> reaches the last 3 days
          compression-level: 0

      # Every main build's APK (only the APK) goes to Telegram (docs/telegram-channel.md): where and with what caption
      # is set in the bot's private chat (tools/telegram_bot.py); skipped without the secrets or with /off.
      # The APK is already in the artifact above, so a Telegram failure only marks this step, not the build.
      - name: Post the APK to Telegram
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_OWNER: ${{ secrets.TELEGRAM_OWNER }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_TOPIC: ${{ secrets.TELEGRAM_TOPIC }}
          GH_TOKEN: ${{ github.token }}          # the previous build and the commits since it (changelog)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          python3 -m venv "$RUNNER_TEMP/telegram"
          "$RUNNER_TEMP/telegram/bin/pip" install -q -r tools/telegram-requirements.txt
          "$RUNNER_TEMP/telegram/bin/python" tools/telegram_publish.py --notify fail \
            --apk "out/SCAMERA-0.98-${{ steps.ver.outputs.code }}-SCAM.apk" \
            --from-rev "${{ github.event.before }}" --to-rev "${{ github.sha }}"
